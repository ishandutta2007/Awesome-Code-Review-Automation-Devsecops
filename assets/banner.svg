<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 15px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .badge-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }

    /* Ambient Pulsing Glow Orbs in Background */
    @keyframes pulseOrb1 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.7; }
      50% { transform: translate(40px, -20px) scale(1.15); opacity: 0.95; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.6; }
      50% { transform: translate(-30px, 25px) scale(1.2); opacity: 0.85; }
    }

    /* Moving DevSecOps Signal Wave */
    @keyframes waveMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }

    /* Dynamic Pipeline Nodes Pulse */
    @keyframes pulseNode {
      0%, 100% { r: 6px; fill-opacity: 0.9; }
      50% { r: 8.5px; fill-opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
    }
    @keyframes pulseNodeViolet {
      0%, 100% { r: 6px; fill-opacity: 0.9; }
      50% { r: 8.5px; fill-opacity: 1; filter: drop-shadow(0 0 6px #c084fc); }
    }

    .orb-1 {
      animation: pulseOrb1 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: pulseOrb2 10s ease-in-out infinite;
      transform-origin: 1000px 320px;
    }
    .flow-stream {
      stroke-dasharray: 8 12;
      animation: waveMove 4s linear infinite;
    }
    .node-cyan {
      animation: pulseNode 3s ease-in-out infinite;
    }
    .node-violet {
      animation: pulseNodeViolet 3s ease-in-out infinite;
      animation-delay: 1.5s;
    }
  </style>

  <!-- Deep Background Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Background Orbs (Guaranteed strictly in background) -->
  <g>
    <circle class="orb-1" cx="220" cy="120" r="180" fill="url(#glowGrad1)" />
    <circle class="orb-2" cx="980" cy="300" r="220" fill="url(#glowGrad2)" />
  </g>

  <!-- Subtle Blueprint / Grid Lines -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="420" />
    <line x1="240" y1="0" x2="240" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="560" y1="0" x2="560" y2="420" />
    <line x1="720" y1="0" x2="720" y2="420" />
    <line x1="880" y1="0" x2="880" y2="420" />
    <line x1="1040" y1="0" x2="1040" y2="420" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="360" x2="1200" y2="360" />
  </g>

  <!-- Decorative Pipeline Flow Line (Background Activity) -->
  <g opacity="0.45">
    <path class="flow-stream" d="M 80 340 C 350 340, 420 375, 700 375 C 920 375, 1020 340, 1140 340" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path class="flow-stream" d="M 80 345 C 320 345, 480 315, 750 315 C 950 315, 1050 345, 1140 345" fill="none" stroke="#a855f7" stroke-width="1.8" />
  </g>

  <!-- Animated Pipeline Checkpoint Nodes -->
  <g>
    <circle class="node-cyan" cx="260" cy="342" r="6" fill="#38bdf8" />
    <circle class="node-violet" cx="520" cy="355" r="6" fill="#c084fc" />
    <circle class="node-cyan" cx="780" cy="328" r="6" fill="#38bdf8" />
    <circle class="node-violet" cx="1020" cy="342" r="6" fill="#c084fc" />
  </g>

  <!-- Top Tagline Pill -->
  <g transform="translate(80, 52)">
    <rect width="320" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#10b981" />
    <text x="32" y="22" class="tagline-text">Curated DevSecOps &amp; AI Stack</text>
  </g>

  <!-- Main Title & Gradient Header (Guaranteed High-Contrast Foreground) -->
  <g transform="translate(80, 142)">
    <text class="title-text">
      Awesome <tspan fill="url(#accentGrad)">Code Review Automation</tspan>
    </text>
    <text y="42" class="title-text" font-size="34" fill="#f8fafc">&amp; DevSecOps Ecosystem</text>
  </g>

  <!-- Subtitle -->
  <text x="80" y="235" class="subtitle-text">
    The comprehensive directory of AI-driven PR reviewers, SAST security gates, and automated pipelines.
  </text>

  <!-- Interactive / Informative Feature Badges (Bottom Layer Foreground) -->
  <g transform="translate(80, 275)">
    <!-- Badge 1: AI Code Review -->
    <g transform="translate(0, 0)">
      <rect width="186" height="42" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <text x="18" y="26" class="badge-text">🤖 AI PR Reviewers</text>
    </g>

    <!-- Badge 2: DevSecOps Gates -->
    <g transform="translate(198, 0)">
      <rect width="180" height="42" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
      <text x="18" y="26" class="badge-text">🛡️ DevSecOps Gates</text>
    </g>

    <!-- Badge 3: SAST & Secret Scanners -->
    <g transform="translate(390, 0)">
      <rect width="210" height="42" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1" />
      <text x="18" y="26" class="badge-text">🔍 SAST &amp; Secret Scanners</text>
    </g>

    <!-- Badge 4: Open-Source Bots -->
    <g transform="translate(612, 0)">
      <rect width="200" height="42" rx="10" fill="url(#cardGrad)" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1" />
      <text x="18" y="26" class="badge-text">⚡ Self-Hosted Bots</text>
    </g>

    <!-- Badge 5: High Velocity -->
    <g transform="translate(824, 0)">
      <rect width="190" height="42" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
      <text x="18" y="26" class="badge-text">🚀 Automated Merges</text>
    </g>
  </g>

  <!-- Border Frame Accent -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6" />
</svg>
